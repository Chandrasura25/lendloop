# Self-hosted n8n for LendLoop's automations.
#   cp .env.n8n.example .env.n8n   # fill in the secrets
#   docker compose up -d
#   docker compose exec n8n n8n import:workflow --separate --input=/workflows
# Then open http://localhost:5678, and activate the three "LendLoop –" workflows.
services:
  n8n:
    # Pinned to the n8n 1.x line: the Code nodes rely on 1.x behaviour for $env and require('crypto').
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-1.123.0}
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env.n8n # secrets live here (git-ignored), never in the workflow JSON
    environment:
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      # Code nodes read secrets from the environment and use Node's crypto for HMAC.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      # Print Code-node console.log output (the mock notifications) to `docker compose logs`.
      CODE_ENABLE_STDOUT: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Keep a week of execution history so failed runs can be inspected.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    extra_hosts:
      # Lets n8n reach a local Convex backend (npx convex dev --local) on the host machine.
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro

volumes:
  n8n_data:
